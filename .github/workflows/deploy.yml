# Deploy: a Vercel faz preview por PR e produção a partir de main (integração Git).
# Este workflow só aplica as migrações ANTES do deploy de produção (expand → migrate → contract).
name: Migrate production
on:
  push:
    branches: [main]
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrar (se o banco já estiver configurado)
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          if [ -z "$DATABASE_ADMIN_URL" ]; then echo "Segredo DATABASE_ADMIN_URL ainda não configurado: nada a migrar."; exit 0; fi
          pnpm db:migrate
