name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aos_owner, POSTGRES_PASSWORD: aos_owner, POSTGRES_DB: agency_os }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aos_owner -d agency_os" --health-interval 2s --health-retries 30
    env:
      APP_ENV: ci
      DATABASE_URL: postgres://aos_app:aos_app_ci@localhost:5432/agency_os
      DATABASE_ADMIN_URL: postgres://aos_owner:aos_owner@localhost:5432/agency_os
      APP_DB_PASSWORD: aos_app_ci
      INNGEST_DEV: '1'
      EVENT_DISPATCH: local
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      APP_URL: http://localhost:3100
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:roles && pnpm db:migrate && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @aos/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @aos/e2e test:e2e
